<style>
:root{--bg:#f3f6fb;--sf:#ffffff;--sf2:#eef2f9;--ink:#111827;--mu:#5b6b82;--ln:#d9e1ee;--pri:#2563eb;--pri2:#3b82f6;--acc:#7c3aed;--ok:#059669;--sh:0 10px 26px -14px rgba(30,41,59,.35);--g1:#e3eafa;--top:rgba(255,255,255,.88);--nav:rgba(255,255,255,.96);--stage:#dfe5f0;--pill:#1d4ed8;color-scheme:light;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0e14;--sf:#131822;--sf2:#1a2230;--ink:#eef2f7;--mu:#8d9bb0;--ln:#232d3f;--pri:#64b5f6;--pri2:#3b82f6;--acc:#a78bfa;--ok:#34d399;--sh:0 12px 32px -12px rgba(0,0,0,.7);--g1:#141b29;--top:rgba(19,24,34,.85);--nav:rgba(15,20,29,.95);--stage:#07090d;--pill:var(--pill);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0b0e14;--sf:#131822;--sf2:#1a2230;--ink:#eef2f7;--mu:#8d9bb0;--ln:#232d3f;--pri:#64b5f6;--pri2:#3b82f6;--acc:#a78bfa;--ok:#34d399;--sh:0 12px 32px -12px rgba(0,0,0,.7);--g1:#141b29;--top:rgba(19,24,34,.85);--nav:rgba(15,20,29,.95);--stage:#07090d;--pill:var(--pill);color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:radial-gradient(circle at top,var(--g1) 0%,var(--bg) 65%);
  color:var(--ink);
  font:15px/1.6 "Hind Siliguri",system-ui,sans-serif;
  min-height:100vh;
}
main{max-width:680px;margin:0 auto;padding:14px 14px 100px}

/* Header */
.top{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;margin-bottom:12px;
  background:var(--top);backdrop-filter:blur(10px);
  border:1px solid var(--ln);border-radius:20px;box-shadow:var(--sh);
}
.logo{
  width:46px;height:46px;border-radius:15px;
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border:1px solid #334155;
  display:grid;place-items:center;font-size:24px;
  box-shadow:0 0 20px rgba(100,181,246,.2);
}
.top h1{font-size:19px;margin:0;letter-spacing:.3px}
.top small{color:var(--mu);font-size:12.5px;display:block}
.sp{flex:1}
.badge{
  font-size:11.5px;padding:4px 10px;border-radius:999px;
  background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3);
}

/* Cards & Controls */
.card{
  background:var(--sf);border:1px solid var(--ln);
  border-radius:20px;padding:15px;margin:12px 0;box-shadow:var(--sh);
  animation:fadeUp .3s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
h2{font-size:16.5px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.hint{
  font-size:13px;color:var(--mu);background:var(--sf2);
  padding:8px 12px;border-radius:12px;margin-bottom:12px;
  border-left:3px solid var(--pri);
}

/* Chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:none;padding:8px 14px;border-radius:999px;
  border:1px solid var(--ln);background:var(--sf2);
  color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;
  transition:.15s;
}
.chips button.on{
  background:linear-gradient(135deg,var(--pri2),var(--acc));
  color:#fff;border-color:transparent;font-weight:600;
}

/* Buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px 16px;border-radius:14px;border:0;
  background:linear-gradient(135deg,var(--pri2),var(--acc));
  color:#fff;font:inherit;font-weight:600;font-size:15px;
  cursor:pointer;margin:8px 0;box-shadow:0 8px 20px -8px rgba(124,58,237,.6);
  transition:transform .12s;
}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--sf2);color:var(--ink);border:1px solid var(--ln);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 8px 20px -8px rgba(16,185,129,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* Inputs */
input,textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--ln);
  border-radius:13px;background:var(--sf2);color:var(--ink);
  font:inherit;outline:0;margin:4px 0 10px;
}
input:focus,textarea:focus{border-color:var(--pri)}
label{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:5px}

/* Caption Item */
.cap{
  background:var(--sf2);border:1px solid var(--ln);
  border-radius:16px;padding:13px;margin:10px 0;
  transition:.15s;
}
.cap:hover{border-color:#334155}
.cap-txt{
  font-size:15.5px;line-height:1.65;white-space:pre-line;
  margin-bottom:10px;color:var(--ink);
}
.cap-tag{font-size:12px;color:var(--pri);margin-bottom:8px;display:inline-block}
.cap-act{display:flex;gap:8px}
.mini{
  flex:1;padding:8px 10px;border-radius:11px;border:1px solid var(--ln);
  background:var(--sf);color:var(--ink);font:inherit;font-size:13px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
}
.mini:active{transform:scale(.96)}
.mini.primary{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.4);color:var(--pill)}

/* Canvas Studio */
.preview-wrap{
  display:flex;justify-content:center;background:var(--stage);
  border-radius:16px;padding:12px;border:1px dashed #2d3748;margin:10px 0;
}
canvas{
  width:100%;max-width:290px;aspect-ratio:9/16;
  border-radius:14px;box-shadow:0 15px 35px rgba(0,0,0,.8);
  background:#111827;
}
.range-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.range-row input[type=range]{margin:0;padding:0;accent-color:var(--pri)}

/* Bottom Nav */
#nav{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;background:var(--nav);backdrop-filter:blur(12px);
  border-top:1px solid var(--ln);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;
}
#nav button{
  flex:1;border:0;background:none;color:var(--mu);
  font:inherit;font-size:12px;padding:6px 2px;border-radius:14px;cursor:pointer;
}
#nav button span{display:block;font-size:21px;line-height:1.2;transition:.2s}
#nav button.on{color:var(--pri);font-weight:700;background:rgba(100,181,246,.08)}
#nav button.on span{transform:translateY(-2px) scale(1.15)}

/* Toast */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:86px;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:600;
  font-size:13.5px;box-shadow:0 10px 25px rgba(0,0,0,.5);
  z-index:50;animation:fadeUp .2s;
}
html,body{overflow-x:hidden;max-width:100%}
main{width:100%;min-width:0}
.card,.cap,.hint,.top{min-width:0;overflow-wrap:anywhere}
.chips{max-width:100%}
label.btn{position:relative}
.fileinput{position:absolute!important;inset:0;width:100%!important;height:100%;opacity:0;margin:0!important;padding:0!important;cursor:pointer;font-size:0}
.tg{color:var(--pill);font-size:14px;line-height:1.7;margin:8px 0}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--sf2);border:1px solid var(--ln);flex:none}
.seg button{position:relative;z-index:1;width:32px;height:30px;border:0;background:none;padding:0;margin:0;font-size:15px;line-height:1;cursor:pointer;border-radius:999px;opacity:.6;transition:opacity .2s,transform .2s}
.seg button[aria-pressed=true]{opacity:1;transform:scale(1.12)}
.seg .thumb{position:absolute;top:3px;left:3px;width:32px;height:30px;border-radius:999px;background:linear-gradient(135deg,var(--pri2),var(--acc));box-shadow:0 4px 12px -4px rgba(124,58,237,.65);transition:transform .3s cubic-bezier(.34,1.45,.64,1)}
.seg[data-v=auto] .thumb{transform:translateX(32px)}
.seg[data-v=dark] .thumb{transform:translateX(64px)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:320px;overflow-y:auto;margin:8px 0;padding:2px}
.fgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--ink);font:inherit;cursor:pointer}
.fgrid button span{font-size:17px;line-height:1.5}
.fgrid button small{font-size:10.5px;color:var(--mu)}
.fgrid button.on{border-color:var(--pri);background:rgba(100,181,246,.16)}
[hidden]{display:none!important}
</style>

  async function sample(prompt, opt) {
    let key = localStorage.getItem(KEYNAME);

    const content = [];
    if (opt && opt.images) for (const f of opt.images) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await shrink(f) } });
    content.push({ type: 'text', text: prompt });
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: MODEL, max_tokens: 1500, messages: [{ role: 'user', content }] })

    const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/json' });

      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;

        ${st.imgObj ? '' : `<label>🌈 Background:</label><div class="chips">${GRADS.map((g,i) => `<button data-bg="${i}" style="min-width:46px;background:linear-gradient(135deg,${g[0]},${g[1]})${st.bg===i?';outline:3px solid var(--pri2);outline-offset:2px':''}">&nbsp;</button>`).join('')}</div>`}
        <button class="btn alt" data-wmpos="1">📍 Watermark: ${st.wmTop?'top':'bottom'}</button>
        <label>✍️ Caption text:</label>
        <textarea id="st-txt" rows="3">${st.text.replace(/</g,'&lt;')}</textarea>

        <div class="two">
          <div>
            <label>🔠 Text size: <b id="sz-v">${st.fontSize}</b></label>
            <div class="range-row"><input id="st-sz" type="range" min="22" max="54" value="${st.fontSize}"></div>
          </div>
          <div>
            <label>↕️ Position: <b id="py-v">${st.posY}%</b></label>
            <div class="range-row"><input id="st-py" type="range" min="15" max="85" value="${st.posY}"></div>
          </div>
        </div>

        <label>🌑 Darkness: <b id="dk-v">${st.darkness}%</b></label>
        <div class="range-row"><input id="st-dk" type="range" min="0" max="75" value="${st.darkness}"></div>

        <label>🕊️ নিচের ওয়াটারমার্ক / আইডির নাম:</label>
        <input id="st-wm" value="${st.watermark.replace(/"/g,'&quot;')}" placeholder="যেমন: Who —^?">

        <button class="btn alt" data-gen="studio">🤖 এই ছবি দেখে AI ক্যাপশন বানাও</button>
        <button class="btn alt" data-share="1">📤 Share image</button>
        <button class="btn ok" id="dl-btn">📥 Save HD image</button>
      </div>
    `;
  }

  function renderTags() {
    return `
      <div class="hint">#️⃣ TikTok ও Reels-এ ভিডিও ছাড়ার সময় নিচের হ্যাশট্যাগগুলো <b>📋 Copy</b> করে পেস্ট করুন।</div>
      ${TAG_SETS.map(t => `
        <div class="card">
          <h2>${t.title}</h2>
          <div style="color:var(--pill);font-size:14px;line-height:1.7;margin-bottom:10px">${t.tags}</div>
          <button class="btn alt" data-copy="${encodeURIComponent(t.tags)}">📋 Copy hashtags</button>
        </div>
      `).join('')}
    `;
  }

  function renderAdd() {
    return `
      <div class="card">
        <h2>➕ Save your own caption</h2>
        <div class="hint">📝 আপনার মাথায় আসা নতুন কোনো গভীর লাইন এখানে লিখে সেভ করে রাখুন, পরে যেকোনো সময় ব্যবহার করতে পারবেন।</div>
        <label>✍️ ক্যাপশন লিখুন:</label>
        <textarea id="new-cap" rows="4" placeholder="যেমন: কিছু মানুষ গল্পের মতো, পড়তে ভালো লাগে কিন্তু নিজের করা যায় না... 🥀"></textarea>
        <button class="btn" id="save-cap">💾 Save caption</button>
      </div>
      ${customCaps.length ? `
        <div class="card">
          <h2>⭐ আপনার সেভ করা ক্যাপশন (${customCaps.length}টি)</h2>
          ${customCaps.map((c, i) => `
            <div class="cap">
              <div class="cap-txt" style="${fontCss(fi)}">${c.text.replace(/</g,'&lt;')}</div>
              <div class="cap-act">
                <button class="mini" data-copy="${encodeURIComponent(c.text)}">📋 Copy</button>
                <button class="mini primary" data-use="${encodeURIComponent(c.text)}">🎨 Use in photo</button>
                <button class="mini" data-del="${i}" style="color:#f87171">🗑️</button>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="card">
        <h2>💾 Backup &amp; accent</h2>
        <div class="two">
          <button class="btn alt" data-bk="1">⬇️ Export</button>
          <label class="btn alt" style="cursor:pointer">⬆️ Import<input id="bk-file" class="fileinput" type="file" accept=".json,application/json"></label>
        </div>
        <label>🎨 Accent color:</label>
        <div class="chips">${Object.keys(ACC).map(k => `<button data-acc="${k}" style="min-width:46px;background:linear-gradient(135deg,${ACC[k][0]},${ACC[k][1]})${acc===k?';outline:3px solid var(--ink);outline-offset:2px':''}">&nbsp;</button>`).join('')}</div>
      </div>
    `;
  }

  function drawCanvas() {
    const cv = $('cv');
    if (!cv) return;
    const [W, H] = RATIOS[st.ratio] || RATIOS['9:16'];
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    cv.style.aspectRatio = W + '/' + H;
    cv.style.maxWidth = W > H ? '100%' : '290px';
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    if (st.imgObj) {
      ctx.save();
      ctx.filter = FILTERS[st.filter] || 'none';
      const img = st.imgObj;
      const sc = Math.max(W / img.width, H / img.height);
      const nw = img.width * sc, nh = img.height * sc;
      ctx.drawImage(img, (W - nw) / 2, (H - nh) / 2, nw, nh);
      ctx.restore();
    } else {
      const g = GRADS[st.bg] || GRADS[0];
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, g[0]); grad.addColorStop(0.5, g[1]); grad.addColorStop(1, g[2]);
      ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
      const rad = ctx.createRadialGradient(W*0.5, H*0.32, 20, W*0.5, H*0.32, W*0.5);
      rad.addColorStop(0, 'rgba(255,255,255,0.14)'); rad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rad; ctx.fillRect(0, 0, W, H);
    }
    ctx.fillStyle = `rgba(5, 8, 13, ${st.darkness / 100})`;
    ctx.fillRect(0, 0, W, H);
    const vig = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

    const k = W / 720, fs = st.fontSize * k;
    ctx.save();
    ctx.font = fontSpec(fi, fs).replace(/\d+(\.\d+)?px/, fs + 'px');
    ctx.fillStyle = st.color; ctx.strokeStyle = st.color;
    ctx.textAlign = st.align; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3;
    const x = st.align === 'left' ? 60 * k : st.align === 'right' ? W - 60 * k : W / 2;
    const lines = (st.text || '').split('\n');
    const lh = fs * 1.55;
    const startY = (H * (st.posY / 100)) - ((lines.length - 1) * lh) / 2;
    const fx = FONTS[fi].fx;
    lines.forEach((line, i) => {
      const y = startY + i * lh, mw = W - 120 * k;
      if (fx === 'outline') { ctx.shadowBlur = 0; ctx.lineWidth = 2.2 * k; ctx.lineJoin = 'round'; ctx.strokeText(line, x, y, mw); }
      else if (fx === 'glow') { ctx.shadowColor = 'rgba(100,181,246,0.95)'; ctx.shadowBlur = 28 * k; ctx.shadowOffsetY = 0; ctx.fillText(line, x, y, mw); ctx.fillText(line, x, y, mw); }
      else ctx.fillText(line, x, y, mw);
    });
    ctx.restore();
    if (st.watermark.trim()) {
      ctx.save();
      ctx.font = `500 ${22 * k}px "Hind Siliguri", sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.textAlign = 'center';
      ctx.fillText(st.watermark.trim(), W / 2, st.wmTop ? 70 * k : H - 70 * k);
      ctx.restore();
    }
  }

  function render() {
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    $('app').innerHTML = {
      caps: renderCaps,
      studio: renderStudio,
      ai: renderAI,
      tags: renderTags,
      add: renderAdd
    }[tab]();
    if (tab === 'studio') drawCanvas();
  }

  document.addEventListener('click', e => {
    const navBtn = e.target.closest('#nav button');
    if (navBtn) { tab = navBtn.dataset.t; render(); window.scrollTo(0,0); return; }

    const thBtn = e.target.closest('[data-th]');
    if (thBtn) {
      theme = thBtn.dataset.th;
      try { localStorage.setItem(KEY+'_th', theme); } catch(_){}
      applyTheme(); return;
    }
    if (e.target.closest('[data-ftoggle]')) { showFonts = !showFonts; render(); return; }
    const fontBtn = e.target.closest('[data-font]');
    if (fontBtn) { fi = Number(fontBtn.dataset.font); render(); ensureFont(); return; }

    const sw = (sel, fn) => { const b = e.target.closest(sel); if (b) { fn(b); return true; } return false; };
    if (sw('[data-ratio]', b => { st.ratio = b.dataset.ratio; render(); })) return;
    if (sw('[data-color]', b => { st.color = b.dataset.color; render(); })) return;
    if (sw('[data-align]', b => { st.align = b.dataset.align; render(); })) return;
    if (sw('[data-bg]', b => { st.bg = Number(b.dataset.bg); render(); })) return;
    if (sw('[data-wmpos]', () => { st.wmTop = !st.wmTop; render(); })) return;
    if (sw('[data-mode]', b => { ai.mode = b.dataset.mode; render(); })) return;
    if (sw('[data-share]', () => shareImage())) return;
    if (sw('[data-bk]', () => exportBackup())) return;
    if (sw('[data-acc]', b => { acc = b.dataset.acc; try { localStorage.setItem(KEY+'_acc', acc); } catch(_){} applyAcc(); render(); })) return;

    const toneBtn = e.target.closest('[data-tone]');
    if (toneBtn) { ai.tone = toneBtn.dataset.tone; render(); return; }

    const saveBtn = e.target.closest('[data-save]');
    if (saveBtn) { aiCaps.unshift({cat:'AI ✨', text: ai.out[Number(saveBtn.dataset.save)], ai:true}); persistAi(); toast('⭐ সেভ হয়েছে (ক্যাপশন ট্যাবে AI ✨)'); return; }

    const genBtn = e.target.closest('[data-gen]');
    if (genBtn) {
      if (ai.mode !== 'caption' && genBtn.dataset.gen === '1') { aiTextRun(); return; }
      const mode = genBtn.dataset.gen;
      if (mode === 'studio') { tab = 'ai'; ai.topic = ai.topic || 'ছবির দৃশ্য অনুযায়ী'; }
      aiRun({ n: 8, tone: ai.tone, topic: ai.topic, img: mode !== '1' }).then(r => {
        if (r) { ai.out = r.caps; ai.tags = r.tags; render(); window.scrollTo(0,0); }
      });
      return;
    }

    const moreBtn = e.target.closest('[data-more]');
    if (moreBtn) {
      const real = !['সব ✨','আমার লেখা ⭐'].includes(cat);
      aiRun({ n: 10, tone: ai.tone, topic: real ? cat.replace(/[^\u0980-\u09FF\s&]/g,'').trim() : 'গভীর নান্দনিক ভাবনা' }).then(r => {
        if (!r) return;
        r.caps.forEach(t => aiCaps.unshift({cat: real ? cat : 'AI ✨', text: t, ai: true}));
        persistAi(); render(); toast('✅ ' + r.caps.length + 'টি নতুন ক্যাপশন যোগ হয়েছে');
      });
      return;
    }

    const catBtn = e.target.closest('[data-cat]');
    if (catBtn) { cat = catBtn.dataset.cat; render(); return; }

    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) { copyText(decodeURIComponent(copyBtn.dataset.copy)); return; }

    const useBtn = e.target.closest('[data-use]');
    if (useBtn) {
      st.text = decodeURIComponent(useBtn.dataset.use);
      tab = 'studio';
      render();
      window.scrollTo(0,0);
      toast('🎨 ফটো স্টুডিওতে নেওয়া হয়েছে!');
      return;
    }

    const fltBtn = e.target.closest('[data-flt]');
    if (fltBtn) { st.filter = fltBtn.dataset.flt; render(); return; }

    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      customCaps.splice(Number(delBtn.dataset.del), 1);
      persist();
      toast('🗑️ মুছে ফেলা হয়েছে');
      render();
      return;
    }

    if (e.target.id === 'save-cap') {
      const val = ($('new-cap').value || '').trim();
      if (!val) { toast('⚠️ আগে কিছু লিখুন!'); return; }
      customCaps.unshift({cat:'আমার লেখা ⭐', text: val, custom: true});
      persist();
      toast('✅ ক্যাপশন সেভ হয়েছে!');
      tab = 'caps'; cat = 'আমার লেখা ⭐';
      render();
      return;
    }

    if (e.target.id === 'dl-btn') {
      saveImage();
      return;
    }
  });

  // Live inputs
  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'q') {
      search = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const q = $('q');
      if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch(_){} }
      return;
    }
    if (id === 'ai-topic') { ai.topic = e.target.value; return; }
    if (id === 'st-txt') { st.text = e.target.value; drawCanvas(); }
    else if (id === 'st-sz') { st.fontSize = Number(e.target.value); $('sz-v').textContent = st.fontSize; drawCanvas(); }
    else if (id === 'st-py') { st.posY = Number(e.target.value); $('py-v').textContent = st.posY + '%'; drawCanvas(); }
    else if (id === 'st-dk') { st.darkness = Number(e.target.value); $('dk-v').textContent = st.darkness + '%'; drawCanvas(); }
    else if (id === 'st-wm') { st.watermark = e.target.value; drawCanvas(); }
  });

  // Image pick
  document.addEventListener('change', e => {
    if (e.target.id === 'bk-file') { importBackup(e.target.files && e.target.files[0]); return; }
    if (e.target.id !== 'img-in' && e.target.id !== 'ai-img') return;
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    pickedFile = f;
    if (e.target.id === 'ai-img') { toast('🖼️ ছবি বাছা হয়েছে!'); render(); return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { st.imgObj = img; drawCanvas(); toast('🖼️ ছবি যোগ হয়েছে!'); };
    img.onerror = () => toast('⚠️ ছবিটি খোলা যায়নি');
    img.src = url;
  });

  async function saveImage() {
    const cv = $('cv');
    if (!cv) return;
    let dl = null;
    try { dl = window.claude ? await window.claude.use('downloads') : null; } catch(_) {}
    if (!dl) { toast('⚠️ এখানে সেভ সাপোর্ট নেই — ছবিতে চেপে ধরে সেভ করুন'); return; }
    cv.toBlob(async blob => {
      if (!blob) { toast('⚠️ ছবি তৈরি হয়নি'); return; }
      try {
        await dl.save({ filename: 'who-caption-' + Date.now() + '.png', data: blob });
        toast('✅ ছবি সেভ হয়েছে!');
      } catch (err) {
        if (!err || err.code !== 'declined') toast('⚠️ সেভ করা যায়নি');
      }
    }, 'image/png');
  }

  applyTheme(); applyAcc();
  render();
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => drawCanvas());
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('600 34px "Hind Siliguri"'),
      document.fonts.load('500 22px "Hind Siliguri"')
    ]).then(() => drawCanvas()).catch(() => {});
  }
})();
</script>
</body>
</html>
